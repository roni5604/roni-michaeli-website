name: Preview build

# Builds every push to a non-main branch and publishes the result (built site,
# logs, screenshots, accessibility report) to the `ci-preview` branch so the
# redesign can be reviewed before it goes live. Nothing here deploys the site.
on:
  push:
    branches-ignore: [main, ci-preview]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare report folder
        run: mkdir -p /tmp/report && echo "ref=${GITHUB_SHA}" > /tmp/report/INFO.txt
      - name: Install
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/report/install.log
      - name: Type check
        run: (npx astro check 2>&1 || echo "ASTRO_CHECK_FAILED") | tee /tmp/report/check.log
        continue-on-error: true
      - name: Build
        id: build
        run: npm run build 2>&1 | tee /tmp/report/build.log; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Screenshots and accessibility scan
        if: steps.build.outcome == 'success'
        run: |
          npx playwright install --with-deps chromium > /dev/null
          node scripts/ci-review.mjs /tmp/report 2>&1 | tee /tmp/report/review.log
        continue-on-error: true
      - name: Publish to ci-preview branch
        if: always()
        run: |
          echo "build=${{ steps.build.outcome }}" >> /tmp/report/INFO.txt
          cp package-lock.json /tmp/report/ 2>/dev/null || true
          [ -d dist ] && cp -r dist /tmp/report/dist || true
          cd /tmp/report
          git init -q -b ci-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Preview of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-preview
