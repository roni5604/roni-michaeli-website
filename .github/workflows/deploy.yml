name: Deploy to GitHub Pages

# Every push to main builds the Astro site and publishes it to
# ronimichaeli.com (custom domain set in public/CNAME and the Pages settings).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing / Yandex / other IndexNow engines that pages changed (free,
  # no account needed). Bing results also feed ChatGPT and Copilot search.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          sleep 30
          URLS=$(curl -fsSL https://ronimichaeli.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          echo "$URLS" | jq length
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"ronimichaeli.com\",\"key\":\"d9c7fad2d413dd3eaf0313bd08ceafca\",\"keyLocation\":\"https://ronimichaeli.com/d9c7fad2d413dd3eaf0313bd08ceafca.txt\",\"urlList\":$URLS}" \
            -w '\nIndexNow HTTP %{http_code}\n'
